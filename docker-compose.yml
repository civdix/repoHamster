version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: debuglab-postgres
    restart: always
    environment:
      POSTGRES_USER: debuglab
      POSTGRES_PASSWORD: debuglab_password
      POSTGRES_DB: debuglab_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
